services:
  teamcal:
    image: ghcr.io/didier57/teamcal-app:${TEAMCAL_VERSION:-latest}
    container_name: teamcal
    restart: unless-stopped
    ports:
      - "${TEAMCAL_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      TZ: ${TZ:-Europe/Paris}
      DATABASE_PATH: /app/data/teamcal.sqlite
    volumes:
      - teamcal_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  teamcal_data:
